<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>🌸 MUJ Campus AI Navigator</title>

  <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            outfit: ['"Outfit"', 'sans-serif'],
          },
          colors: {
            primary: '#6b38d4',
            'primary-container': '#8455ef',
            secondary: '#4648d4',
            surface: '#f7f9fb',
          }
        }
      }
    };
  </script>

  <style>
    * {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    ::-webkit-scrollbar {
      display: none;
    }
    .leaflet-popup-content-wrapper {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      box-shadow: 0 12px 30px -5px rgba(107, 56, 212, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.8);
      padding: 4px;
    }
    .leaflet-popup-tip {
      background: white;
    }
    .leaflet-popup-content {
      margin: 8px 12px;
    }
  </style>
</head>
<body class="bg-[#f7f9fb] text-slate-800 antialiased overflow-hidden select-none">

  <!-- Fullscreen Interactive Map -->
  <div id="map" class="absolute inset-0 w-full h-full z-0"></div>

  <!-- ELEMENT 1: Stitch Compact Floating Search Pill Centered at Top -->
  <div class="absolute top-6 left-1/2 -translate-x-1/2 z-30 pointer-events-auto flex items-center gap-2 px-3 py-2 rounded-full bg-white/90 backdrop-blur-2xl shadow-[0_8px_30px_rgb(0,0,0,0.06)] border border-white/80 transition-all hover:shadow-[0_12px_36px_rgb(0,0,0,0.08)] max-w-[92vw]">
    
    <!-- Logo / Brand Sparkle Icon -->
    <div class="w-8 h-8 rounded-full bg-purple-100/80 flex items-center justify-center text-purple-700 text-sm shadow-inner shrink-0">
      🌸
    </div>

    <!-- Start Origin Selector -->
    <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-slate-100/70 hover:bg-slate-100 transition-colors cursor-pointer">
      <span class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_6px_rgba(16,185,129,0.6)] shrink-0"></span>
      <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider shrink-0 font-outfit">From</span>
      <select id="start-select" class="bg-transparent text-xs font-semibold text-slate-800 outline-none cursor-pointer pr-1 max-w-[140px] truncate">
        <option value="">Start location...</option>
      </select>
    </div>

    <!-- Soft Arrow Divider -->
    <span class="text-slate-300 text-xs font-bold select-none px-0.5">➔</span>

    <!-- Destination Goal Selector -->
    <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-slate-100/70 hover:bg-slate-100 transition-colors cursor-pointer">
      <span class="w-2 h-2 rounded-full bg-rose-500 shadow-[0_0_6px_rgba(244,63,94,0.6)] shrink-0"></span>
      <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider shrink-0 font-outfit">To</span>
      <select id="dest-select" class="bg-transparent text-xs font-semibold text-slate-800 outline-none cursor-pointer pr-1 max-w-[140px] truncate">
        <option value="">Destination...</option>
      </select>
    </div>

    <!-- Cute Gradient Pill Action Button -->
    <button id="btn-route" class="px-4 py-2 rounded-full bg-gradient-to-r from-purple-600 via-[#8455ef] to-indigo-600 hover:opacity-95 text-white text-xs font-semibold shadow-md shadow-purple-200 flex items-center gap-1.5 active:scale-95 transition-all cursor-pointer shrink-0">
      <span>Find Path</span>
      <span class="text-xs">✨</span>
    </button>
  </div>

  <!-- ELEMENT 2: Stitch Simple Cute Floating Result Badge Centered at Bottom -->
  <div id="result-badge" class="absolute bottom-8 left-1/2 -translate-x-1/2 z-30 pointer-events-auto hidden transition-all">
    <div class="px-5 py-2.5 rounded-full bg-white/90 backdrop-blur-xl shadow-[0_8px_25px_rgba(0,0,0,0.06)] border border-white/80 flex items-center gap-3 text-slate-700 text-xs font-medium transition-all hover:scale-105 select-none">
      <div class="flex items-center gap-1.5">
        <span class="text-sm">🚶</span>
        <span class="font-bold text-slate-900" id="stat-time">-- min</span>
        <span class="text-slate-400">walk</span>
      </div>
      <span class="w-1 h-1 rounded-full bg-slate-300"></span>
      <div class="flex items-center gap-1.5">
        <span class="text-sm">📏</span>
        <span class="font-bold text-slate-900" id="stat-distance">-- m</span>
      </div>
      <span class="w-1 h-1 rounded-full bg-slate-300"></span>
      <div class="flex items-center gap-1 text-emerald-700 bg-emerald-50 px-2.5 py-0.5 rounded-full text-[11px] font-semibold">
        <span>🌿 Step-free</span>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let map;
    let landmarksData = [];
    let landmarkMarkers = {};
    let activeRouteLayer = null;
    let activeGlowLayer = null;
    let startMarker = null;
    let goalMarker = null;

    // Initialize Map with soft pastel CartoDB Voyager tiles
    function initMap() {
      map = L.map('map', {
        center: [26.8439, 75.5650],
        zoom: 17,
        zoomControl: false
      });

      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; CartoDB &copy; MUJ',
        maxZoom: 20,
        subdomains: 'abcd'
      }).addTo(map);

      L.control.zoom({ position: 'bottomright' }).addTo(map);
    }

    // Category pin colors
    const categoryColors = {
      academic: '#8b5cf6',
      dining: '#f97316',
      hostel: '#0284c7',
      sports: '#10b981',
      gate: '#64748b',
      facility: '#ec4899',
      junction: '#94a3b8'
    };

    // Load Landmark Data from live backend
    async function loadData() {
      try {
        const [lmRes, connRes] = await Promise.all([
          fetch('/api/landmarks'),
          fetch('/api/connections')
        ]);
        landmarksData = await lmRes.json();
        const connectionsData = await connRes.json();

        populateSelects(landmarksData);
        renderCampusWalkways(connectionsData);
        renderLandmarks(landmarksData);

        // Pre-select defaults
        document.getElementById('start-select').value = 'GATE_1';
        document.getElementById('dest-select').value = 'LIBRARY_CENTRAL';
        
        findRoute();
      } catch (err) {
        console.error('Failed to load map data:', err);
      }
    }

    // Populate Dropdown Menus
    function populateSelects(landmarks) {
      const startSelect = document.getElementById('start-select');
      const destSelect = document.getElementById('dest-select');
      const sorted = [...landmarks].sort((a, b) => a.name.localeCompare(b.name));

      sorted.forEach(lm => {
        startSelect.add(new Option(lm.name, lm.id));
        destSelect.add(new Option(lm.name, lm.id));
      });
    }

    // Render subtle pastel campus walkway lines
    function renderCampusWalkways(connections) {
      connections.forEach(conn => {
        L.polyline([
          [conn.source_coords.lat, conn.source_coords.lon],
          [conn.target_coords.lat, conn.target_coords.lon]
        ], {
          color: '#cbd5e1',
          weight: 2,
          opacity: 0.5,
          dashArray: '4, 6',
          interactive: false
        }).addTo(map);
      });
    }

    // Render cute landmark pins on map
    function renderLandmarks(landmarks) {
      landmarks.forEach(lm => {
        const color = categoryColors[lm.node_type] || '#8b5cf6';
        
        const markerHtml = `
          <div class="group relative flex items-center justify-center cursor-pointer transition-transform duration-200 hover:scale-125">
            <div style="background-color: ${color};" class="w-4 h-4 rounded-full border-2 border-white shadow-sm"></div>
          </div>
        `;

        const icon = L.divIcon({
          html: markerHtml,
          className: 'custom-pin',
          iconSize: [16, 16],
          iconAnchor: [8, 8]
        });

        const marker = L.marker([lm.latitude, lm.longitude], { icon }).addTo(map);
        landmarkMarkers[lm.id] = marker;

        const popupContent = `
          <div class="text-slate-800 text-center min-w-[150px]">
            <h4 class="font-bold text-xs mb-2 text-slate-800">${lm.name}</h4>
            <div class="flex justify-center gap-1.5">
              <button onclick="setAsPoint('${lm.id}', 'start')" class="py-1 px-2.5 rounded-full bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold text-[10px] transition-all">
                🟢 Set From
              </button>
              <button onclick="setAsPoint('${lm.id}', 'dest')" class="py-1 px-2.5 rounded-full bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold text-[10px] transition-all">
                🚩 Set To
              </button>
            </div>
          </div>
        `;

        marker.bindPopup(popupContent);
      });
    }

    // Set points from map clicks
    window.setAsPoint = function(nodeId, type) {
      if (type === 'start') {
        document.getElementById('start-select').value = nodeId;
      } else {
        document.getElementById('dest-select').value = nodeId;
      }
      map.closePopup();
      findRoute();
    };

    // Calculate Route via A* Engine
    async function findRoute() {
      const start = document.getElementById('start-select').value;
      const goal = document.getElementById('dest-select').value;
      if (!start || !goal) return;

      try {
        const res = await fetch('/api/route', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ start, goal, mode: 'shortest', algorithm: 'A*' })
        });

        const data = await res.json();
        if (data.success) {
          renderRoute(data);
          displayResult(data);
        }
      } catch (err) {
        console.error('Routing failed:', err);
      }
    }

    // Draw Route on Map
    function renderRoute(routeData) {
      if (activeRouteLayer) map.removeLayer(activeRouteLayer);
      if (activeGlowLayer) map.removeLayer(activeGlowLayer);
      if (startMarker) map.removeLayer(startMarker);
      if (goalMarker) map.removeLayer(goalMarker);

      const latlngs = routeData.path_coords;

      // Outer Glow Polyline
      activeGlowLayer = L.polyline(latlngs, {
        color: '#f472b6',
        weight: 10,
        opacity: 0.35,
        lineCap: 'round',
        lineJoin: 'round'
      }).addTo(map);

      // Primary Vibrant Route Polyline
      activeRouteLayer = L.polyline(latlngs, {
        color: '#8b5cf6',
        weight: 4.5,
        opacity: 0.95,
        lineCap: 'round',
        lineJoin: 'round'
      }).addTo(map);

      // Start Pin
      const startIcon = L.divIcon({
        html: `
          <div class="relative flex items-center justify-center">
            <span class="animate-ping absolute inline-flex h-6 w-6 rounded-full bg-emerald-400 opacity-75"></span>
            <div class="relative w-6 h-6 rounded-full bg-emerald-500 border-2 border-white shadow-md flex items-center justify-center text-white text-[10px]">
              🟢
            </div>
          </div>
        `,
        className: 'route-start-pin',
        iconSize: [24, 24],
        iconAnchor: [12, 12]
      });
      startMarker = L.marker(latlngs[0], { icon: startIcon }).addTo(map);

      // Goal Pin
      const goalIcon = L.divIcon({
        html: `
          <div class="relative flex items-center justify-center">
            <span class="animate-ping absolute inline-flex h-6 w-6 rounded-full bg-rose-400 opacity-75"></span>
            <div class="relative w-6 h-6 rounded-full bg-rose-500 border-2 border-white shadow-md flex items-center justify-center text-white text-[10px]">
              🚩
            </div>
          </div>
        `,
        className: 'route-goal-pin',
        iconSize: [24, 24],
        iconAnchor: [12, 12]
      });
      goalMarker = L.marker(latlngs[latlngs.length - 1], { icon: goalIcon }).addTo(map);

      map.fitBounds(activeGlowLayer.getBounds(), {
        paddingTopLeft: [100, 50],
        paddingBottomRight: [50, 100],
        maxZoom: 18,
        animate: true,
        duration: 0.8
      });
    }

    // Display Stitch Result Badge
    function displayResult(data) {
      const badge = document.getElementById('result-badge');
      badge.classList.remove('hidden');

      const minutes = Math.max(1, Math.round(data.time_seconds / 60));
      document.getElementById('stat-time').textContent = `${minutes} min`;
      document.getElementById('stat-distance').textContent = `${Math.round(data.distance_meters)} m`;
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', () => {
      initMap();
      loadData();

      document.getElementById('btn-route').addEventListener('click', findRoute);
      document.getElementById('start-select').addEventListener('change', findRoute);
      document.getElementById('dest-select').addEventListener('change', findRoute);
    });
  </script>
</body>
</html>
