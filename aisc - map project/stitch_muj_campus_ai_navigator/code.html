    // Pin metadata dictionary
    const pinsData = {
      gate1: { name: "Main Gate 1 Entry", type: "Campus Gates & Transit", emoji: "🚪", coords: { x: 800, y: 830 }, occupancy: "Fluid (12%)", noise: "Ambient Open Air" },
      library: { name: "Central Library", type: "Academic & Research", emoji: "📚", coords: { x: 760, y: 380 }, occupancy: "Moderate (68%)", noise: "Silent Zone 🎧" },
      ab1: { name: "AB-1 Turing Hall", type: "Faculty of Computing", emoji: "🎓", coords: { x: 560, y: 410 }, occupancy: "Bustling (82%)", noise: "Classroom Activity" },
      ab2: { name: "AB-2 Engineering Labs", type: "Robotics & Civil Works", emoji: "🔬", coords: { x: 1030, y: 410 }, occupancy: "Normal (45%)", noise: "Makerspace" },
      foodcourt: { name: "Food Court & G2 Mess", type: "Dining & Social", emoji: "🍜", coords: { x: 1100, y: 550 }, occupancy: "High (91%)", noise: "Social / Music 🎵" },
      hostel_b3: { name: "B3 Aster Hostel", type: "Boys Residence", emoji: "🏡", coords: { x: 320, y: 670 }, occupancy: "Quiet (35%)", noise: "Residential" },
      hostel_g1: { name: "G1 Orchid Hostel", type: "Girls Residence", emoji: "🌸", coords: { x: 1270, y: 670 }, occupancy: "Quiet (40%)", noise: "Residential" },
      sac: { name: "SAC Arena & Gym", type: "Sports & Recreation", emoji: "🏸", coords: { x: 480, y: 560 }, occupancy: "Active (74%)", noise: "Indoor Sports" }
    };

    let activeSelectedPinKey = null;
    let currentScale = 1;
    let currentAlgorithm = 'astar';
    let currentMode = 'quickest';

    // Map Coordinates Preset Routes dictionary
    const routePaths = {
      "gate1->library": "M 800 830 L 800 680 L 680 580 L 680 430 L 760 380",
      "library->gate1": "M 760 380 L 680 430 L 680 580 L 800 680 L 800 830",
      "gate1->ab1": "M 800 830 L 800 680 L 680 580 L 560 410",
      "ab1->gate1": "M 560 410 L 680 580 L 800 680 L 800 830",
      "gate1->foodcourt": "M 800 830 L 800 680 L 920 580 L 1100 550",
      "hostel_b3->library": "M 320 670 L 480 560 L 680 430 L 760 380",
      "sac->ab2": "M 480 560 L 680 580 L 920 580 L 1030 410",
      "foodcourt->hostel_g1": "M 1100 550 L 1180 630 L 1270 670"
    };

    function selectPin(pinKey) {
      activeSelectedPinKey = pinKey;
      const data = pinsData[pinKey];
      if (!data) return;

      const popup = document.getElementById('pin-popup-card');
      document.getElementById('popup-emoji').innerText = data.emoji;
      document.getElementById('popup-title').innerText = data.name;
      document.getElementById('popup-type').innerText = data.type;
      document.getElementById('popup-occupancy').innerText = data.occupancy;
      document.getElementById('popup-noise').innerText = data.noise;

      popup.classList.remove('hidden');
    }

    function closePopup() {
      document.getElementById('pin-popup-card').classList.add('hidden');
      activeSelectedPinKey = null;
    }

    function setAsStartFromPopup() {
      if (!activeSelectedPinKey) return;
      const select = document.getElementById('start-select');
      select.value = activeSelectedPinKey;
      closePopup();
      calculateRoute();
    }

    function setAsGoalFromPopup() {
      if (!activeSelectedPinKey) return;
      const select = document.getElementById('dest-select');
      select.value = activeSelectedPinKey;
      closePopup();
      calculateRoute();
    }

    function onOriginChange() {
      calculateRoute();
    }

    function onDestinationChange() {
      calculateRoute();
    }

    function swapLocations() {
      const startSelect = document.getElementById('start-select');
      const destSelect = document.getElementById('dest-select');
      const temp = startSelect.value;
      startSelect.value = destSelect.value;
      destSelect.value = temp;
      calculateRoute();
    }

    function setRoutingMode(mode, btnEl) {
      currentMode = mode;
      document.querySelectorAll('.mode-pill').forEach(b => {
        b.className = 'mode-pill px-3 py-1.5 rounded-full text-xs font-semibold bg-surface-container text-on-surface-variant hover:text-on-surface flex items-center gap-1 transition-all';
      });
      btnEl.className = 'mode-pill px-3 py-1.5 rounded-full text-xs font-semibold bg-primary-fixed text-on-primary-fixed flex items-center gap-1 transition-all';
      calculateRoute();
    }

    function selectAlgorithm(algo, btnEl) {
      currentAlgorithm = algo;
      document.querySelectorAll('.algo-btn').forEach(b => {
        b.className = 'algo-btn py-1.5 rounded-xl font-label-sm text-label-sm font-semibold text-on-surface-variant hover:text-on-surface transition-all';
      });
      btnEl.className = 'algo-btn py-1.5 rounded-xl font-label-sm text-label-sm font-semibold bg-surface-container-lowest text-primary shadow-sm transition-all';

      const heuristicLabels = {
        'astar': 'Heuristic: 3D Euclidean',
        'dijkstra': 'Dijkstra (No Heuristic)',
        'greedy': 'Heuristic: Manhattan Distance',
        'bfs': 'Hop Distance (Uniform)'
      };
      document.getElementById('heuristic-subtext').innerText = heuristicLabels[algo] || 'AI Weighted';
      calculateRoute();
    }

    function calculateRoute() {
      const startKey = document.getElementById('start-select').value;
      const destKey = document.getElementById('dest-select').value;

      const startData = pinsData[startKey] || pinsData.gate1;
      const destData = pinsData[destKey] || pinsData.library;

      // Update Node circles on map
      const startNode = document.getElementById('start-node');
      const startAura = document.getElementById('start-aura');
      const goalNode = document.getElementById('goal-node');
      const goalAura = document.getElementById('goal-aura');

      startNode.setAttribute('cx', startData.coords.x);
      startNode.setAttribute('cy', startData.coords.y);
      startAura.setAttribute('cx', startData.coords.x);
      startAura.setAttribute('cy', startData.coords.y);

      goalNode.setAttribute('cx', destData.coords.x);
      goalNode.setAttribute('cy', destData.coords.y);
      goalAura.setAttribute('cx', destData.coords.x);
      goalAura.setAttribute('cy', destData.coords.y);

      // SVG path calculation
      const pathEl = document.getElementById('active-nav-path');
      const routeKey = `${startKey}->${destKey}`;
      
      let customD = routePaths[routeKey];
      if (!customD) {
        // Fallback smooth spline through campus central junction
        customD = `M ${startData.coords.x} ${startData.coords.y} Q 800 580 ${destData.coords.x} ${destData.coords.y}`;
      }
      pathEl.setAttribute('d', customD);

      // Dynamic Stat Updates based on mode & algorithm
      let baseDist = Math.round(Math.hypot(destData.coords.x - startData.coords.x, destData.coords.y - startData.coords.y) * 0.75);
      if (baseDist < 80) baseDist = 140;

      if (currentAlgorithm === 'greedy') baseDist += 35;
      if (currentAlgorithm === 'bfs') baseDist += 75;

      const walkingTime = Math.max(1, Math.round(baseDist / 85));
      const nodeCount = currentAlgorithm === 'astar' ? 8 : (currentAlgorithm === 'dijkstra' ? 42 : (currentAlgorithm === 'greedy' ? 9 : 64));

      document.getElementById('stat-time').innerText = `~${walkingTime} min`;
      document.getElementById('stat-distance').innerText = `${baseDist} m`;
      document.getElementById('stat-nodes').innerText = `${nodeCount} nodes`;

      // Update itinerary text
      document.getElementById('step-1-title').innerText = `Depart ${startData.name}`;
      document.getElementById('step-3-title').innerText = `Arrive at ${destData.name} 🚩`;
    }

    function toggleLayer(layerName) {
      const layerEl = document.getElementById(`layer-${layerName}`);
      const btn = document.getElementById(`toggle-${layerName}`);
      if (!layerEl) return;

      const isHidden = layerEl.getAttribute('opacity') === '0';
      if (isHidden) {
        layerEl.setAttribute('opacity', layerName === 'covered' ? '0.9' : '0.85');
        btn.classList.remove('bg-surface-container', 'text-on-surface-variant');
        btn.classList.add('bg-primary-fixed', 'text-on-primary-fixed-variant');
      } else {
        layerEl.setAttribute('opacity', '0');
        btn.classList.remove('bg-primary-fixed', 'text-on-primary-fixed-variant');
        btn.classList.add('bg-surface-container', 'text-on-surface-variant');
      }
    }

    function zoomMap(factor) {
      currentScale = Math.min(Math.max(0.7, currentScale * factor), 1.9);
      document.getElementById('map-viewport').style.transform = `scale(${currentScale})`;
    }

    function resetMap() {
      currentScale = 1;
      document.getElementById('map-viewport').style.transform = 'scale(1) translate(0px, 0px)';
    }

    function openAlgorithmModal() {
      const modal = document.getElementById('algo-modal');
      const content = document.getElementById('algo-modal-content');
      modal.classList.remove('opacity-0', 'pointer-events-none');
      content.classList.remove('scale-95');
      content.classList.add('scale-100');
    }

    function closeAlgorithmModal() {
      const modal = document.getElementById('algo-modal');
      const content = document.getElementById('algo-modal-content');
      modal.classList.add('opacity-0', 'pointer-events-none');
      content.classList.add('scale-95');
      content.classList.remove('scale-100');
    }

    function shareRoute() {
      const btnText = document.getElementById('share-btn-text');
      btnText.innerText = 'Copied! ✨';
      setTimeout(() => {
        btnText.innerText = 'Share Path';
      }, 2000);
    }

    function startLiveNav() {
      alert("🧭 Live AR Campus Navigation initialized with centimeter-accuracy GPS beacon.");
    }

    // Initialize layout on ready
    window.addEventListener('DOMContentLoaded', () => {
      calculateRoute();
    });
  </script>
</div></main></body></html>
